name: Build DroidDesk EXE

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
    paths:
      - 'DroidDesk_v1.0.ps1'
      - '.github/workflows/build.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install PS2EXE
        shell: pwsh
        run: Install-Module ps2exe -Scope CurrentUser -Force -AllowClobber

      - name: Convert PowerShell app to EXE
        shell: pwsh
        run: |
          Invoke-PS2EXE `
            -InputFile "$env:GITHUB_WORKSPACE\DroidDesk_v1.0.ps1" `
            -OutputFile "$env:GITHUB_WORKSPACE\DroidDesk.exe" `
            -NoConsole `
            -Title "DroidDesk" `
            -Product "DroidDesk" `
            -Description "Android desktop workspace for Windows" `
            -Company "DroidDesk" `
            -Version "1.0.0.0"

      - name: Upload EXE build
        uses: actions/upload-artifact@v4
        with:
          name: DroidDesk-Windows
          path: DroidDesk.exe
          if-no-files-found: error

      - name: Attach EXE to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: DroidDesk.exe
          generate_release_notes: true
